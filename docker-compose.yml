services:
  db:
    image: postgres:16-alpine
    container_name: cabales_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cabales_user
      POSTGRES_PASSWORD: cabales_secret
      POSTGRES_DB: cabales_db
    ports:
      - "5434:5432"
    volumes:
      - cabales_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cabales_user -d cabales_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cabales_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://cabales_user:cabales_secret@db:5432/cabales_db?schema=public
      - FRONTEND_URL=http://localhost:4200
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_REGION=${S3_REGION:-auto}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - cabales_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cabales_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  cabales_uploads:
    name: cabales_uploads
  cabales_postgres_data:
    name: cabales_postgres_data
