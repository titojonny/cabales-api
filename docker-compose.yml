# PostgreSQL exclusivo para desarrollo local; no contiene credenciales de producción.
# api y frontend son opcionales; el flujo diario usa `docker compose up -d postgres`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cabales
      POSTGRES_USER: cabales
      POSTGRES_PASSWORD: cabales_local_only
    ports:
      - '5432:5432'
    volumes:
      - cabales-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cabales -d cabales']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://cabales:cabales_local_only@postgres:5432/cabales?schema=public
      CORS_ORIGINS: http://localhost:4200,http://127.0.0.1:4200,http://localhost:8100
      COOKIE_NAME: cabales_session
      SESSION_TTL_HOURS: 168
      TRUST_PROXY: 1
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - cabales-uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '4200:80'
    depends_on:
      - api

volumes:
  cabales-postgres:
  cabales-uploads:
