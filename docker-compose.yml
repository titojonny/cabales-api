# PostgreSQL exclusivo para desarrollo local; no contiene credenciales de producción.
# El cliente React vive en el repositorio hermano cabales-app (Vite en :5173).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cabales
      POSTGRES_USER: cabales
      POSTGRES_PASSWORD: cabales_local_only
    ports:
      # 5433 en el host para no chocar con un PostgreSQL de Windows u otros proyectos en 5432.
      - '5433:5432'
    volumes:
      - cabales-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cabales -d cabales']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://cabales:cabales_local_only@postgres:5432/cabales?schema=public
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      COOKIE_NAME: cabales_session
      SESSION_TTL_HOURS: 168
      TRUST_PROXY: 1
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cabales-postgres:
