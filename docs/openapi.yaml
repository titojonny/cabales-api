        '200':
          description: 'Operación correcta'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Achievement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/achievements/history:
    get:
      tags: [Achievements]
      summary: 'Logros obtenidos'
      operationId: listAchievementHistory
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 'Operación correcta'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      type: object
                      required: [code, name, description, awardedAt]
                      properties:
                        code:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                        awardedAt:
                          type: string
                          format: date-time
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/privacy/requests:
    get:
      tags: [Privacy]
      summary: 'Solicitudes ARCO-POL propias'
      operationId: listPrivacyRequests
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 'Operación correcta'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PrivacyRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Privacy]
      summary: 'Crea una solicitud de acceso, rectificación, supresión, oposición o portabilidad'
      operationId: createPrivacyRequest
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivacyRequestInput' }
      responses:
        '201':
          description: 'Operación correcta'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data: { $ref: '#/components/schemas/PrivacyRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/privacy/requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Privacy]
      summary: 'Detalle de una solicitud propia'
      operationId: getPrivacyRequest
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 'Operación correcta'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data: { $ref: '#/components/schemas/PrivacyRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/privacy/requests/{requestId}/confirm:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Privacy]
      summary: 'Confirma la solicitud; la supresión exige contraseña'
      operationId: confirmPrivacyRequest
      description: 'ACCESS y PORTABILITY quedan COMPLETED con exportación temporal. ERASURE anonimiza la cuenta, transfiere la propiedad de grupos compartidos, elimina credenciales, sesiones y documentos propios y limpia cookies. RECTIFICATION y OBJECTION pasan a IN_PROGRESS para atención manual.'
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: []
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        '200':
          description: 'Operación correcta'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data: { $ref: '#/components/schemas/PrivacyRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/privacy/requests/{requestId}/cancel:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Privacy]
      summary: 'Cancela una solicitud pendiente'
      operationId: cancelPrivacyRequest
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      responses:
        '200':
          description: 'Operación correcta'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data: { $ref: '#/components/schemas/PrivacyRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/privacy/requests/{requestId}/export:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Privacy]
      summary: 'Descarga la exportación JSON de datos propios'
      operationId: exportPrivacyRequest
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 'Operación correcta'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    description: 'Perfil, membresías, eventos, gastos con su parte, transferencias, fondos, documentos (metadatos), avisos, solicitudes y actividad propia. Sin secretos ni datos personales de terceros.'
          headers:
            Content-Disposition:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cabales_session
      description: Nombre predeterminado configurable mediante COOKIE_NAME.
    csrfCookie:
      type: apiKey
      in: cookie
      name: cabales_session_csrf
      description: Cookie de doble envío cuyo prefijo sigue COOKIE_NAME; /auth/me valida su hash antes de devolverla.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Debe coincidir con csrfCookie y con el hash ligado a la sesión.
  parameters:
    GroupId: { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
    EventId: { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    ExpenseId: { name: expenseId, in: path, required: true, schema: { type: string, format: uuid } }
    SettlementId:
      { name: settlementId, in: path, required: true, schema: { type: string, format: uuid } }
    TransferId:
      { name: transferId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Se reproduce durante 24 horas; una llave vencida puede reclamarse de nuevo atómicamente.
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[!-~]+$' }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FundId:
      name: fundId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemberId:
      name: memberId
      in: path
      required: true
      description: 'Identificador del miembro del fondo.'
      schema:
        type: string
        format: uuid
    BudgetId:
      name: budgetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    HealthSuccess:
      {
        description: Estado actual,
        content: { application/json: { schema: { $ref: '#/components/schemas/HealthEnvelope' } } },
      }
    AuthSuccess:
      description: Identidad y CSRF
      headers:
        Cache-Control: { schema: { type: string, const: 'private, no-store' } }
        Set-Cookie:
          description: Register/login emiten sesión HttpOnly y CSRF legible; /me no rota cookies.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthEnvelope' }
    MutationSuccess:
      {
        description: Mutación completada,
        content:
          { application/json: { schema: { $ref: '#/components/schemas/MutationEnvelope' } } },
      }
    GroupSuccess:
      {
        description: Grupo,
        content: { application/json: { schema: { $ref: '#/components/schemas/GroupEnvelope' } } },
      }
    GroupListSuccess:
      {
        description: Grupos,
        content:
          { application/json: { schema: { $ref: '#/components/schemas/GroupListEnvelope' } } },
      }
    GroupDetailSuccess:
      {
        description: Grupo y miembros,
        content:
          { application/json: { schema: { $ref: '#/components/schemas/GroupDetailEnvelope' } } },
      }
    InvitationSuccess:
      {
        description: Invitación y token efímero,
        content:
          { application/json: { schema: { $ref: '#/components/schemas/InvitationEnvelope' } } },
      }
    MembershipSuccess:
      {
        description: Membresía aceptada,
        content:
          { application/json: { schema: { $ref: '#/components/schemas/MembershipEnvelope' } } },
      }
    EventSuccess:
      {
        description: Evento creado,
        content: { application/json: { schema: { $ref: '#/components/schemas/EventEnvelope' } } },
      }
    EventListSuccess:
      {
        description: Eventos,
        content:
          { application/json: { schema: { $ref: '#/components/schemas/EventListEnvelope' } } },
      }
    EventDetailSuccess:
      {
        description: Detalle de evento,
        content:
          { application/json: { schema: { $ref: '#/components/schemas/EventDetailEnvelope' } } },
      }
    ExpenseListSuccess:
      {
        description: Gastos,
        content:
          { application/json: { schema: { $ref: '#/components/schemas/ExpenseListEnvelope' } } },
      }
    ExpenseDetailSuccess:
      {
        description: Detalle de gasto,
        content:
          { application/json: { schema: { $ref: '#/components/schemas/ExpenseDetailEnvelope' } } },
      }
    SettlementListSuccess:
      {
        description: Liquidaciones,
        content:
          { application/json: { schema: { $ref: '#/components/schemas/SettlementListEnvelope' } } },
      }
    SettlementDetailSuccess:
      {
        description: Detalle de liquidación,
        content:
          {
            application/json: { schema: { $ref: '#/components/schemas/SettlementDetailEnvelope' } },
          },
      }
    TransferSuccess:
      {
        description: Transferencia pagada o recuperación idempotente,
        content:
          { application/json: { schema: { $ref: '#/components/schemas/TransferEnvelope' } } },
      }
    BadRequest:
      {
        description: Entrada inválida,
        content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
      }
    Unauthorized:
      {
        description: Sesión ausente o inválida,
        content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
      }
    Forbidden:
      {
        description: CSRF o permiso inválido,
        content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
      }
    NotFound:
      {
        description: Recurso no visible,
        content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
      }
    Conflict:
      {
        description: Estado concurrente o idempotencia incompatible,
        content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
      }
    Gone:
      {
        description: Invitación vencida,
        content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
      }
    UnprocessableEntity:
      {
        description: Invariante de negocio incumplida,
        content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
      }
    TooManyRequests:
      {
        description: Límite de solicitudes excedido,
        content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
      }
    PayloadTooLarge:
      description: 'Archivo o cuerpo demasiado grande'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UnsupportedMediaType:
      description: 'Tipo de contenido no permitido'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServiceUnavailable:
      {
        description: PostgreSQL no disponible,
        content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
      }
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [success, error]
      properties:
        success: { const: false }
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details: {}
    HealthEnvelope:
      type: object
      required: [success, data]
      properties:
        {
          success: { const: true },
          data: { type: object, required: [status], properties: { status: { enum: [up, ready] } } },
        }
    MutationEnvelope:
      type: object
      required: [success, data]
      properties:
        {
          success: { const: true },
          data: { type: object, additionalProperties: { type: boolean } },
        }
    User:
      type: object
      additionalProperties: false
      required: [id, email, displayName, avatarUrl, locale, emailVerified]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        avatarUrl: { type: [string, 'null'], format: uri }
        locale: { type: string }
        emailVerified: { type: boolean }
    AuthEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { const: true }
        data:
          type: object
          additionalProperties: false
          required: [user, csrfToken]
          properties: { user: { $ref: '#/components/schemas/User' }, csrfToken: { type: string } }
    RegisterInput:
      type: object
      additionalProperties: false
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 12, maxLength: 128 }
        displayName: { type: string, minLength: 2, maxLength: 120 }
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 12, maxLength: 128 }
    Group:
      type: object
      additionalProperties: false
      required: [id, name, description, currency, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GroupEnvelope:
      type: object
      required: [success, data]
      properties: { success: { const: true }, data: { $ref: '#/components/schemas/Group' } }
    GroupListItem:
      allOf:
        - $ref: '#/components/schemas/Group'
        - type: object
          required: [members, _count]
          properties:
            members: { type: array, items: { $ref: '#/components/schemas/Membership' } }
            _count:
              {
                type: object,
                required: [members, events, expenses],
                properties:
                  {
                    members: { type: integer },
                    events: { type: integer },
                    expenses: { type: integer },
                  },
              }
    GroupListEnvelope:
      type: object
      required: [success, data]
      properties:
        {
          success: { const: true },
          data: { type: array, items: { $ref: '#/components/schemas/GroupListItem' } },
        }
    Membership:
      type: object
      required: [id, role]
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        role: { enum: [OWNER, ADMIN, MEMBER] }
        joinedAt: { type: string, format: date-time }
    GroupDetail:
      allOf:
        - $ref: '#/components/schemas/Group'
        - type: object
          required: [members]
          properties:
            members:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/Membership'
                  - type: object
                    required: [user]
                    properties: { user: { $ref: '#/components/schemas/User' } }
    GroupDetailEnvelope:
      type: object
      required: [success, data]
      properties: { success: { const: true }, data: { $ref: '#/components/schemas/GroupDetail' } }
    GroupInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        currency: { type: string, pattern: '^[A-Z]{3}$', default: USD }
    GroupPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 500 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    InvitationInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        {
          email: { type: string, format: email, maxLength: 320 },
          role: { enum: [ADMIN, MEMBER], default: MEMBER },
        }
    AcceptInvitationInput:
      type: object
      additionalProperties: false
      required: [token]
      properties: { token: { type: string, minLength: 20, maxLength: 200 } }
    InvitationEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { const: true }
        data:
          type: object
          required: [invitation, token, delivery]
          properties:
            token:
              {
                type: string,
                description: Se muestra una sola vez para compartir el enlace manualmente.,
              }
            delivery:
              { enum: [email, manual], description: manual cuando no hay proveedor de correo real. }
            invitation:
              {
                type: object,
                required: [id, groupId, email, role, status, expiresAt],
                properties:
                  {
                    id: { type: string, format: uuid },
                    groupId: { type: string, format: uuid },
                    email: { type: string, format: email },
                    role: { enum: [ADMIN, MEMBER] },
                    status: { const: PENDING },
                    expiresAt: { type: string, format: date-time },
                  },
              }
    MembershipEnvelope:
      type: object
      required: [success, data]
      properties: { success: { const: true }, data: { $ref: '#/components/schemas/Membership' } }
    EventBase:
      type: object
      required: [id, groupId, name, description, startsAt, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        startsAt: { type: string, format: date-time }
        status: { enum: [OPEN, CLOSED, CANCELLED] }
        createdAt: { type: string, format: date-time }
    EventParticipant:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
        groupMemberId: { type: [string, 'null'], format: uuid }
        guestName: { type: [string, 'null'] }
        groupMember: { type: [object, 'null'] }
    EventEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { const: true }
        data:
          allOf:
            - $ref: '#/components/schemas/EventBase'
            - type: object
              required: [participants]
              properties:
                {
                  participants:
                    { type: array, items: { $ref: '#/components/schemas/EventParticipant' } },
                }
    EventListEnvelope:
      type: object
      required: [success, data]
      properties:
        {
