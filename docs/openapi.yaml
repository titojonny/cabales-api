          name,
          mimeType,
          sizeBytes,
          groupId,
          eventId,
          expenseId,
          settlementId,
          createdAt,
          updatedAt,
          owner,
          access,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        mimeType:
          enum: [application/pdf, image/jpeg, image/png, image/webp]
        sizeBytes:
          type: [integer, 'null']
        groupId:
          type: [string, 'null']
          format: uuid
        eventId:
          type: [string, 'null']
          format: uuid
        expenseId:
          type: [string, 'null']
          format: uuid
        settlementId:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        owner:
          type: object
          required: [id, displayName]
          properties:
            id:
              type: string
              format: uuid
            displayName:
              type: string
        access:
          enum: [VIEW, EDIT, MANAGE]
    DocumentPatch:
      type: object
      additionalProperties: false
      required: []
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        eventId:
          type: [string, 'null']
          format: uuid
        expenseId:
          type: [string, 'null']
          format: uuid
        settlementId:
          type: [string, 'null']
          format: uuid
      minProperties: 1
    DocumentGrant:
      type: object
      required: [userId, displayName, access, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        access:
          enum: [VIEW, EDIT, MANAGE]
        createdAt:
          type: string
          format: date-time
    OcrProposal:
      type: object
      required: [items]
      properties:
        merchant:
          type: [string, 'null']
        totalCents:
          type: [integer, 'null']
        currency:
          type: [string, 'null']
        occurredAt:
          type: [string, 'null']
          format: date-time
        items:
          type: array
          items:
            type: object
            required: [description, amountCents]
            properties:
              description:
                type: string
              amountCents:
                type: integer
        confidence:
          type: number
          minimum: 0
          maximum: 1
    OcrJob:
      type: object
      required:
        [
          id,
          documentId,
          status,
          attempts,
          errorCode,
          createdAt,
          startedAt,
          finishedAt,
          confirmedAt,
          confirmedExpenseId,
          proposal,
          maxAttempts,
          canRetry,
          provider,
        ]
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: [string, 'null']
          format: uuid
        status:
          enum: [PENDING, PROCESSING, SUCCEEDED, FAILED]
        attempts:
          type: integer
        errorCode:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
        confirmedAt:
          type: [string, 'null']
          format: date-time
        confirmedExpenseId:
          type: [string, 'null']
          format: uuid
        proposal:
          oneOf:
            - $ref: '#/components/schemas/OcrProposal'
            - type: 'null'
        maxAttempts:
          type: integer
        canRetry:
          type: boolean
        provider:
          type: string
    CabudasTransfer:
      type: object
      required:
        [
          transferId,
          settlementId,
          groupId,
          groupName,
          eventId,
          eventName,
          direction,
          counterparty,
          amountCents,
          currency,
          status,
          paidAt,
          createdAt,
        ]
      properties:
        transferId:
          type: string
          format: uuid
        settlementId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        groupName:
          type: string
        eventId:
          type: string
          format: uuid
        eventName:
          type: string
        direction:
          enum: [PAY, RECEIVE]
        counterparty:
          type: object
          required: [userId, displayName, isGuest]
          properties:
            userId:
              type: [string, 'null']
              format: uuid
            displayName:
              type: string
            isGuest:
              type: boolean
        amountCents:
          type: integer
        currency:
          type: string
        status:
          enum: [PENDING, PAID, DISPUTED, CANCELLED]
        paidAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    CabudasSummary:
      type: object
      required: [totals, groups, people, simplifiedTransfers, pendingTransfers, openEvents]
      properties:
        totals:
          type: array
          items:
            type: object
            required: [currency, owedToMeCents, iOweCents, netCents]
            properties:
              currency:
                type: string
              owedToMeCents:
                type: integer
              iOweCents:
                type: integer
              netCents:
                type: integer
        groups:
          type: array
          items:
            type: object
            required: [groupId, groupName, currency, owedToMeCents, iOweCents, netCents]
            properties:
              groupId:
                type: string
                format: uuid
              groupName:
                type: string
              currency:
                type: string
              owedToMeCents:
                type: integer
              iOweCents:
                type: integer
              netCents:
                type: integer
        people:
          type: array
          items:
            type: object
            required: [counterparty, groupId, currency, netCents]
            properties:
              counterparty:
                type: object
                required: [userId, displayName, isGuest]
                properties:
                  userId:
                    type: [string, 'null']
                    format: uuid
                  displayName:
                    type: string
                  isGuest:
                    type: boolean
              groupId:
                type: [string, 'null']
                format: uuid
              currency:
                type: string
              netCents:
                type: integer
                description: 'Positivo: te deben; negativo: debes.'
        simplifiedTransfers:
          type: array
          items:
            type: object
            required: [direction, counterparty, groupId, currency, amountCents]
            properties:
              direction:
                enum: [PAY, RECEIVE]
              counterparty:
                type: object
                required: [userId, displayName, isGuest]
                properties:
                  userId:
                    type: [string, 'null']
                    format: uuid
                  displayName:
                    type: string
                  isGuest:
                    type: boolean
              groupId:
                type: [string, 'null']
                format: uuid
              currency:
                type: string
              amountCents:
                type: integer
        pendingTransfers:
          type: array
          items: { $ref: '#/components/schemas/CabudasTransfer' }
        openEvents:
          type: array
          items:
            type: object
            required: [eventId, eventName, groupId, groupName, currency, myNetCents]
            properties:
              eventId:
                type: string
                format: uuid
              eventName:
                type: string
              groupId:
                type: string
                format: uuid
              groupName:
                type: string
              currency:
                type: string
              myNetCents:
                type: integer
    StatisticsSummary:
      type: object
      required:
        [
          range,
          currency,
          availableCurrencies,
          granularity,
          totals,
          byCategory,
          byGroup,
          byEvent,
          byPerson,
          trend,
          budgets,
        ]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        currency:
          type: [string, 'null']
        availableCurrencies:
          type: array
          items:
            type: string
        granularity:
          enum: [week, month]
        totals:
          type: object
          required: [spentCents, expenseCount, myShareCents, myPaidCents, averageExpenseCents]
          properties:
            spentCents:
              type: integer
            expenseCount:
              type: integer
            myShareCents:
              type: integer
            myPaidCents:
              type: integer
            averageExpenseCents:
              type: integer
        byCategory:
          type: array
          items:
            type: object
            required: [categoryId, name, color, totalCents, count]
            properties:
              categoryId:
                type: [string, 'null']
                format: uuid
              name:
                type: string
              color:
                type: [string, 'null']
              totalCents:
                type: integer
              count:
                type: integer
        byGroup:
          type: array
          items:
            type: object
            required: [groupId, name, totalCents, count]
            properties:
              groupId:
                type: string
                format: uuid
              name:
                type: string
              totalCents:
                type: integer
              count:
                type: integer
        byEvent:
          type: array
          items:
            type: object
            required: [eventId, name, groupId, totalCents, count]
            properties:
              eventId:
                type: string
                format: uuid
              name:
                type: string
              groupId:
                type: string
                format: uuid
              totalCents:
                type: integer
              count:
                type: integer
        byPerson:
          type: array
          items:
            type: object
            required: [userId, displayName, paidCents, shareCents]
            properties:
              userId:
                type: [string, 'null']
                format: uuid
              displayName:
                type: string
              paidCents:
                type: integer
              shareCents:
                type: integer
        trend:
          type: array
          items:
            type: object
            required: [period, totalCents, myShareCents]
            properties:
              period:
                type: string
              totalCents:
                type: integer
              myShareCents:
                type: integer
        budgets:
          type: array
          items:
            type: object
            required:
              [
                budgetId,
                name,
                groupId,
                amountCents,
                spentCents,
                progressPercent,
                alert,
                periodStart,
                periodEnd,
              ]
            properties:
              budgetId:
                type: string
                format: uuid
              name:
                type: string
              groupId:
                type: string
                format: uuid
              amountCents:
                type: integer
              spentCents:
                type: integer
              progressPercent:
                type: number
              alert:
                enum: [OK, WARNING, EXCEEDED]
              periodStart:
                type: string
                format: date-time
              periodEnd:
                type: string
                format: date-time
    Notification:
      type: object
      required: [id, type, title, body, data, status, createdAt, readAt, archivedAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          enum:
            [
              invitation.received,
              invitation.accepted,
              settlement.created,
              transfer.paid,
              budget.threshold,
              fund.movement,
              ocr.finished,
              privacy.updated,
              achievement.unlocked,
            ]
        title:
          type: string
        body:
          type: string
        data:
          type: [object, 'null']
        status:
          enum: [UNREAD, READ, ARCHIVED]
        createdAt:
          type: string
          format: date-time
        readAt:
          type: [string, 'null']
          format: date-time
        archivedAt:
          type: [string, 'null']
          format: date-time
    NotificationPreference:
      type: object
      additionalProperties: false
      required: [type, inApp, email, push]
      properties:
        type:
          enum:
            [
              invitation.received,
              invitation.accepted,
              settlement.created,
              transfer.paid,
              budget.threshold,
              fund.movement,
              ocr.finished,
              privacy.updated,
              achievement.unlocked,
            ]
        inApp:
          type: boolean
        email:
          type: boolean
        push:
          type: boolean
    NotificationPreferencesInput:
      type: object
      additionalProperties: false
      required: [preferences]
      properties:
        preferences:
          type: array
          minItems: 1
          maxItems: 9
          items: { $ref: '#/components/schemas/NotificationPreference' }
    NotificationPreferencesEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          const: true
        data:
          type: object
          required: [preferences, channels]
          properties:
            preferences:
              type: array
              items: { $ref: '#/components/schemas/NotificationPreference' }
            channels:
              type: object
              required: [inApp, email, push]
              properties:
                inApp:
                  type: boolean
                email:
                  type: boolean
                push:
                  type: boolean
    PushSubscriptionInput:
      type: object
      additionalProperties: false
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://'
        keys:
          type: object
          additionalProperties: false
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
              minLength: 16
              maxLength: 512
              pattern: '^[A-Za-z0-9_-]+$'
            auth:
              type: string
              minLength: 8
              maxLength: 512
              pattern: '^[A-Za-z0-9_-]+$'
    Achievement:
      type: object
      required: [code, name, description, category, target, progress, status, awardedAt]
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        target:
          type: integer
        progress:
          type: integer
        status:
          enum: [LOCKED, IN_PROGRESS, UNLOCKED]
        awardedAt:
          type: [string, 'null']
          format: date-time
    PrivacyRequest:
      type: object
      required:
        [
          id,
          type,
          status,
          reason,
          createdAt,
          updatedAt,
          confirmedAt,
          cancelledAt,
          completedAt,
          exportExpiresAt,
          resultSummary,
          exportAvailable,
          requiresPassword,
        ]
      properties:
        id:
          type: string
          format: uuid
        type:
          enum: [ACCESS, RECTIFICATION, ERASURE, OBJECTION, PORTABILITY]
        status:
          enum: [PENDING, IN_PROGRESS, COMPLETED, REJECTED, CANCELLED]
        reason:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        confirmedAt:
          type: [string, 'null']
          format: date-time
        cancelledAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        exportExpiresAt:
          type: [string, 'null']
          format: date-time
        resultSummary:
          type: [object, 'null']
        exportAvailable:
          type: boolean
        requiresPassword:
          type: boolean
    PrivacyRequestInput:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          enum: [ACCESS, RECTIFICATION, ERASURE, OBJECTION, PORTABILITY]
        reason:
          type: string
          maxLength: 1000
