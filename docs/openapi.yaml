# Contrato HTTP implementado por Cabales API v1. Los nombres de cookie muestran sus valores predeterminados configurables.
openapi: 3.1.0
info:
  title: Cabales API
  version: 1.2.0
  license: { name: ISC, identifier: ISC }
  description: >-
    API de autenticación, grupos, eventos, gastos exactos, liquidaciones, fondos, presupuestos, documentos, OCR, Cabudas, estadísticas, avisos, logros y privacidad. Importes en centavos.
    Todas las respuestas /api/v1 usan Cache-Control private, no-store; health y ready usan no-store.
servers:
  - url: /
tags:
  - name: Health
    description: Estado del proceso y sus dependencias.
  - name: Auth
    description: Registro, sesión y recuperación CSRF.
  - name: Groups
    description: Grupos, membresías e invitaciones.
  - name: Events
    description: Eventos y participantes canónicos.
  - name: Expenses
    description: Gastos manuales y reparto exacto.
  - name: Settlements
    description: Cierres y transferencias.
  - name: Funds
    description: 'Fondos comunes con saldo derivado de movimientos inmutables.'
  - name: Budgets
    description: 'Presupuestos por periodo con alertas.'
  - name: Documents
    description: 'Documentos privados con permisos y URLs firmadas.'
  - name: OCR
    description: 'Lectura asíncrona de comprobantes con confirmación humana.'
  - name: Cabudas
    description: 'Deudas consolidadas del usuario.'
  - name: Statistics
    description: 'Agregados de gasto autorizados.'
  - name: Notifications
    description: 'Avisos internos, preferencias y Web Push.'
  - name: Achievements
    description: 'Logros de uso con reglas transparentes.'
  - name: Privacy
    description: 'Derechos ARCO-POL, exportación y supresión.'
paths:
  /health:
    get:
      tags: [Health]
      summary: Comprueba el proceso sin consultar PostgreSQL
      operationId: getHealth
      security: []
      responses:
        '200': { $ref: '#/components/responses/HealthSuccess' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /ready:
    get:
      tags: [Health]
      summary: Comprueba conectividad con PostgreSQL
      operationId: getReady
      security: []
      responses:
        '200': { $ref: '#/components/responses/HealthSuccess' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Registra un usuario y emite sesión y CSRF
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201': { $ref: '#/components/responses/AuthSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Inicia una sesión opaca revocable
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoca la sesión actual
      operationId: logout
      security: [{ sessionCookie: [], csrfCookie: [], csrfHeader: [] }]
      responses:
        '200': { $ref: '#/components/responses/MutationSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Recupera identidad y CSRF validado desde su cookie
      operationId: getMe
      security: [{ sessionCookie: [], csrfCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch:
      tags: [Auth]
      summary: 'Rectifica nombre visible o idioma del titular'
      operationId: updateMe
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfilePatch' }
      responses:
        '200':
          description: 'Operación correcta'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/groups:
    get:
      tags: [Groups]
      summary: Lista los grupos del actor
      operationId: listGroups
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/GroupListSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Groups]
      summary: Crea grupo y membresía OWNER
      operationId: createGroup
      security: [{ sessionCookie: [], csrfCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupInput' }
      responses:
        '201': { $ref: '#/components/responses/GroupSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Groups]
      summary: Obtiene grupo y miembros
      operationId: getGroup
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/GroupDetailSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch:
      tags: [Groups]
      summary: Actualiza grupo como OWNER o ADMIN
      operationId: updateGroup
      security: [{ sessionCookie: [], csrfCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupPatch' }
      responses:
        '200': { $ref: '#/components/responses/GroupSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [Groups]
      summary: Elimina un grupo vacío como OWNER
      operationId: deleteGroup
      security: [{ sessionCookie: [], csrfCookie: [], csrfHeader: [] }]
      responses:
        '200': { $ref: '#/components/responses/MutationSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/groups/{groupId}/invitations:
    get:
      tags: [Groups]
      summary: 'Lista invitaciones del grupo (propietario o administrador)'
      operationId: listInvitations
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: status
          in: query
          required: false
          schema:
            enum: [PENDING, ACCEPTED, REVOKED, EXPIRED]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 'Operación correcta'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Groups]
      summary: Crea una invitación y devuelve su token una sola vez
      operationId: createInvitation
      parameters:
        - $ref: '#/components/parameters/GroupId'
      security: [{ sessionCookie: [], csrfCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationInput' }
      responses:
        '201': { $ref: '#/components/responses/InvitationSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/groups/invitations/accept:
    post:
      tags: [Groups]
      summary: Acepta una invitación ligada al correo autenticado
      operationId: acceptInvitation
      security: [{ sessionCookie: [], csrfCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInvitationInput' }
      responses:
        '200': { $ref: '#/components/responses/MembershipSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/groups/{groupId}/events:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Events]
      summary: Lista eventos del grupo
      operationId: listEvents
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/EventListSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Events]
      summary: Crea evento y padrón de participantes
      operationId: createEvent
      security: [{ sessionCookie: [], csrfCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201': { $ref: '#/components/responses/EventSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/groups/{groupId}/events/{eventId}:
    get:
      tags: [Events]
      summary: Obtiene evento, padrón, links y cierre
      operationId: getEvent
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/EventId'
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/EventDetailSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/groups/{groupId}/expenses:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Expenses]
      summary: Lista gastos del grupo
      operationId: listExpenses
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/ExpenseListSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Expenses]
      summary: Crea un gasto manual exacto
      operationId: createExpense
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      security: [{ sessionCookie: [], csrfCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '200': { $ref: '#/components/responses/ExpenseDetailSuccess' }
        '201': { $ref: '#/components/responses/ExpenseDetailSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/groups/{groupId}/expenses/{expenseId}:
    get:
      tags: [Expenses]
      summary: Obtiene partes, pagadores, ítems y asignaciones
      operationId: getExpense
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/ExpenseId'
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/ExpenseDetailSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/groups/{groupId}/settlements:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Settlements]
      summary: Lista liquidaciones
      operationId: listSettlements
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/SettlementListSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Settlements]
      summary: Cierra un evento y crea transferencias
      operationId: createSettlement
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      security: [{ sessionCookie: [], csrfCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettlementInput' }
      responses:
        '200': { $ref: '#/components/responses/SettlementDetailSuccess' }
        '201': { $ref: '#/components/responses/SettlementDetailSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/groups/{groupId}/settlements/{settlementId}:
    get:
      tags: [Settlements]
      summary: Obtiene liquidación, transferencias e historial
      operationId: getSettlement
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/SettlementId'
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/SettlementDetailSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/groups/{groupId}/settlements/{settlementId}/transfers/{transferId}/paid:
    patch:
      tags: [Settlements]
      summary: Marca una transferencia como pagada
      operationId: markTransferPaid
      description: El deudor o un administrador puede repetir PAID; la operación devuelve el estado actual y converge el cierre.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/SettlementId'
        - $ref: '#/components/parameters/TransferId'
      security: [{ sessionCookie: [], csrfCookie: [], csrfHeader: [] }]
      responses:
        '200': { $ref: '#/components/responses/TransferSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/email-verification/request:
    post:
      tags: [Auth]
      summary: 'Solicita verificación de correo sin revelar si la cuenta existe'
      operationId: requestEmailVerification
      description: 'Límite por IP y por hash de correo; enfriamiento de 60 s y el token anterior queda invalidado. El enlace lleva el token en el fragmento (#token=) para que no llegue a logs del servidor.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailInput' }
      responses:
        '202':
          description: 'Aceptada; respuesta idéntica exista o no la cuenta'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/email-verification/resend:
    post:
      tags: [Auth]
      summary: 'Reenvía verificación de correo sin revelar si la cuenta existe'
      operationId: resendEmailVerification
      description: 'Límite por IP y por hash de correo; enfriamiento de 60 s y el token anterior queda invalidado. El enlace lleva el token en el fragmento (#token=) para que no llegue a logs del servidor.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailInput' }
      responses:
        '202':
          description: 'Aceptada; respuesta idéntica exista o no la cuenta'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/password-recovery/request:
    post:
      tags: [Auth]
      summary: 'Solicita recuperación de contraseña sin revelar si la cuenta existe'
      operationId: requestPasswordRecovery
      description: 'Límite por IP y por hash de correo; enfriamiento de 60 s y el token anterior queda invalidado. El enlace lleva el token en el fragmento (#token=) para que no llegue a logs del servidor.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailInput' }
      responses:
        '202':
          description: 'Aceptada; respuesta idéntica exista o no la cuenta'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/password-recovery/resend:
    post:
      tags: [Auth]
      summary: 'Reenvía recuperación de contraseña sin revelar si la cuenta existe'
      operationId: resendPasswordRecovery
      description: 'Límite por IP y por hash de correo; enfriamiento de 60 s y el token anterior queda invalidado. El enlace lleva el token en el fragmento (#token=) para que no llegue a logs del servidor.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailInput' }
      responses:
        '202':
          description: 'Aceptada; respuesta idéntica exista o no la cuenta'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptedEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/email-verification/confirm:
    post:
      tags: [Auth]
      summary: 'Confirma el correo con un token de un solo uso'
      operationId: confirmEmailVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenInput' }
      responses:
        '200':
          description: 'Operación correcta'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/password-recovery/confirm:
    post:
      tags: [Auth]
      summary: 'Restablece la contraseña, revoca todas las sesiones y limpia cookies'
      operationId: confirmPasswordRecovery
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetInput' }
      responses:
        '200':
          description: 'Operación correcta'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [reset]
                    properties:
                      reset:
                        const: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/groups/{groupId}/invitations/{invitationId}/resend:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [Groups]
      summary: 'Reenvía rotando el token; reabre invitaciones vencidas'
      operationId: resendInvitation
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      responses:
        '200':
          description: 'Operación correcta'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
